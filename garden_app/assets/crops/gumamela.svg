<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Open Crop Icon: gumamela (Gumamela) -->

  <!-- Flared crimson red Hibiscus with long protruding stamen column -->
  <!-- 5 broad scarlet petals -->
  <g fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5">
    <ellipse cx="50" cy="28" rx="16" ry="20"/>
    <ellipse cx="28" cy="44" rx="20" ry="16" transform="rotate(-30 28 44)"/>
    <ellipse cx="72" cy="44" rx="20" ry="16" transform="rotate(30 72 44)"/>
    <ellipse cx="36" cy="68" rx="18" ry="18" transform="rotate(-60 36 68)"/>
    <ellipse cx="64" cy="68" rx="18" ry="18" transform="rotate(60 64 68)"/>
  </g>
  <!-- Deep dark center -->
  <circle cx="50" cy="52" r="10" fill="#880E4F"/>
  <!-- Prominent stamen column extending outward -->
  <path d="M 50 52 Q 62 40 76 26" stroke="#D32F2F" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Golden anthers at tip -->
  <circle cx="76" cy="24" r="2" fill="#FDD835"/>
  <circle cx="78" cy="28" r="2" fill="#FDD835"/>
  <circle cx="72" cy="24" r="2" fill="#FDD835"/>
  <circle cx="74" cy="30" r="2" fill="#FDD835"/>
  <circle cx="68" cy="32" r="1.5" fill="#FDD835"/>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Open Crop Icon: mangosteen (Mangosteen) -->

  <!-- Thick green calyx 4-lobed sepals & stem -->
  <g id="calyx">
    <path d="M 50 18 C 50 12 52 8 54 6" stroke="#1B5E20" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="40" cy="28" rx="10" ry="6" fill="#388E3C" transform="rotate(-20 40 28)"/>
    <ellipse cx="60" cy="28" rx="10" ry="6" fill="#388E3C" transform="rotate(20 60 28)"/>
    <ellipse cx="50" cy="24" rx="8" ry="5" fill="#2E7D32"/>
    <ellipse cx="50" cy="30" rx="9" ry="5" fill="#4CAF50"/>
  </g>
  <!-- Dark royal purple spherical fruit -->
  <circle cx="50" cy="60" r="34" fill="#311B92"/>
  <circle cx="50" cy="58" r="32" fill="#4A148C"/>
  <circle cx="48" cy="56" r="28" fill="#6A1B9A"/>
  <!-- Glossy highlights -->
  <path d="M 68 44 C 74 52 74 64 70 72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <circle cx="62" cy="38" r="2.5" fill="#FFFFFF" opacity="0.85"/>

</svg>
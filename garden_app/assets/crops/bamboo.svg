<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Open Crop Icon: bamboo (Bamboo) -->

  <!-- Segmented green bamboo cane with nodes and leaves -->
  <rect x="42" y="10" width="16" height="84" rx="2" fill="#2E7D32"/>
  <rect x="43" y="10" width="14" height="84" rx="2" fill="#43A047"/>
  <!-- Bamboo nodes / rings -->
  <line x1="38" y1="34" x2="62" y2="34" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="64" x2="62" y2="64" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/>
  <!-- Leaves branching from nodes -->
  <path d="M 40 34 C 28 28 20 32 14 36 C 24 40 36 38 40 34 Z" fill="#4CAF50"/>
  <path d="M 60 34 C 72 26 82 30 88 34 C 78 38 66 38 60 34 Z" fill="#4CAF50"/>
  <path d="M 60 64 C 72 58 84 62 90 66 C 80 70 66 68 60 64 Z" fill="#4CAF50"/>
  <!-- Highlight vertical sheen -->
  <line x1="47" y1="12" x2="47" y2="92" stroke="#A5D6A7" stroke-width="2"/>

</svg>
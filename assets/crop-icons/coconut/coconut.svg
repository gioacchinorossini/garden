  <path d="M 70 24 C 76 38 76 64 68 78" stroke="#5D4037" stroke-width="2" fill="none"/>
  <!-- Three germination eyes -->
  <ellipse cx="44" cy="34" rx="4" ry="5" fill="#3E2723"/>
  <ellipse cx="56" cy="34" rx="4" ry="5" fill="#3E2723"/>
  <ellipse cx="50" cy="45" rx="4.5" ry="5" fill="#3E2723"/>

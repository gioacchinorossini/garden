  <path d="M 42 94 L 46 68 L 54 68 L 58 94 Z" fill="#3E2723"/>
  <!-- Massive spreading lush umbrella canopy -->
  <ellipse cx="50" cy="42" rx="38" ry="26" fill="#1B5E20"/>
  <circle cx="30" cy="38" r="18" fill="#2E7D32"/>
  <circle cx="70" cy="38" r="18" fill="#2E7D32"/>
  <circle cx="50" cy="30" r="20" fill="#388E3C"/>
  <!-- Golden yellow blossom sprays (iconic Narra bloom) -->
  <circle cx="34" cy="30" r="3" fill="#FDD835"/>
  <circle cx="44" cy="22" r="3" fill="#FDD835"/>
  <circle cx="56" cy="22" r="3" fill="#FDD835"/>
  <circle cx="66" cy="30" r="3" fill="#FDD835"/>
  <circle cx="50" cy="38" r="3.5" fill="#FDD835"/>
  <circle cx="40" cy="44" r="3" fill="#FDD835"/>

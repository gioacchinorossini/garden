<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Open Crop Icon: grapes (Grapes) -->

  <!-- Vine stem & tendril -->
  <path d="M 50 12 C 50 6 54 4 56 2" stroke="#4E342E" stroke-width="3" fill="none"/>
  <path d="M 50 12 C 40 6 36 10 32 8" stroke="#33691E" stroke-width="2" fill="none"/>
  <path d="M 54 12 C 64 8 72 14 68 22" fill="#2E7D32"/>
  <!-- Hanging Grape Cluster -->
  <g fill="#4A148C">
    <!-- Top row -->
    <circle cx="38" cy="28" r="9"/> <circle cx="50" cy="26" r="9"/> <circle cx="62" cy="28" r="9"/>
    <!-- Row 2 -->
    <circle cx="32" cy="42" r="9"/> <circle cx="44" cy="40" r="9.5"/> <circle cx="56" cy="40" r="9.5"/> <circle cx="68" cy="42" r="9"/>
    <!-- Row 3 -->
    <circle cx="38" cy="54" r="9"/> <circle cx="50" cy="54" r="9.5"/> <circle cx="62" cy="54" r="9"/>
    <!-- Row 4 -->
    <circle cx="44" cy="68" r="8.5"/> <circle cx="56" cy="68" r="8.5"/>
    <!-- Bottom berry -->
    <circle cx="50" cy="80" r="8"/>
  </g>
  <!-- Berry inner lighter purple & highlights -->
  <g fill="#6A1B9A">
    <circle cx="49" cy="25" r="7.5"/>
    <circle cx="43" cy="39" r="8"/>
    <circle cx="55" cy="39" r="8"/>
    <circle cx="49" cy="53" r="8"/>
    <circle cx="43" cy="67" r="7"/>
    <circle cx="55" cy="67" r="7"/>
    <circle cx="49" cy="79" r="6.5"/>
  </g>
  <!-- White highlights -->
  <circle cx="42" cy="37" r="2" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="54" cy="37" r="2" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="48" cy="51" r="2" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="48" cy="77" r="1.5" fill="#FFFFFF" opacity="0.85"/>

</svg>
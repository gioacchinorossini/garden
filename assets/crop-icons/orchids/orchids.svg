<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Open Crop Icon: orchids (Orchids) -->

  <!-- Exotic orchid blossom with spreading petals and central labellum lip -->
  <g id="sepals" fill="#CE93D8">
    <ellipse cx="50" cy="24" rx="10" ry="18"/>
    <ellipse cx="26" cy="62" rx="10" ry="18" transform="rotate(-50 26 62)"/>
    <ellipse cx="74" cy="62" rx="10" ry="18" transform="rotate(50 74 62)"/>
  </g>
  <g id="petals" fill="#AB47BC">
    <ellipse cx="28" cy="38" rx="14" ry="18" transform="rotate(-25 28 38)"/>
    <ellipse cx="72" cy="38" rx="14" ry="18" transform="rotate(25 72 38)"/>
  </g>
  <!-- Central modified Lip (Labellum) -->
  <path d="M 50 46 C 40 46 38 60 44 74 C 48 82 52 82 56 74 C 62 60 60 46 50 46 Z" fill="#6A1B9A"/>
  <circle cx="50" cy="50" r="4" fill="#FDD835"/>
  <circle cx="50" cy="50" r="2" fill="#E65100"/>

</svg>
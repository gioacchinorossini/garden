<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <!-- Receipt Paper -->
  <rect width="700" height="900" fill="#f8fafc"/>
  <rect x="20" y="20" width="660" height="860" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="4"/>
  
  <!-- Receipt Header -->
  <text x="350" y="70" text-anchor="middle" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0f172a">REPUBLIC OF THE PHILIPPINES</text>
  <text x="350" y="92" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" fill="#334155">LAND REGISTRATION AUTHORITY</text>
  <text x="350" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">REGISTRY OF DEEDS - QUEZON CITY</text>
  
  <rect x="220" y="130" width="260" height="30" fill="#0369a1" rx="4"/>
  <text x="350" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="1">OFFICIAL RECEIPT</text>
  
  <!-- Receipt Meta Table -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="600" height="110" fill="#f1f5f9" stroke="#e2e8f0" rx="4"/>
    
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="12" fill="#64748b">RECEIPT NO:</text>
    <text x="130" y="30" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#b91c1c">OR-2023-889104</text>
    
    <text x="360" y="30" font-family="Arial, sans-serif" font-size="12" fill="#64748b">DATE:</text>
    <text x="420" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">10/12/2023 10:45 AM</text>
    
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="12" fill="#64748b">PAYOR:</text>
    <text x="130" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">JOHN LANDOWNER</text>
    
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="#64748b">NATURE OF TRANS:</text>
    <text x="150" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369a1">ISSUANCE OF CERTIFIED TRUE COPY (CTC/CCV)</text>
  </g>
  
  <!-- LOTS HIGHLIGHT BOX -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="600" height="150" fill="#ecfdf5" stroke="#10b981" stroke-width="2" rx="8"/>
    <rect x="15" y="15" width="28" height="28" fill="#10b981" rx="14"/>
    <text x="29" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">✓</text>
    <text x="55" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#065f46">LRA ON-LINE TRACKING SYSTEM (LOTS) REFERENCE</text>
    
    <line x1="15" y1="52" x2="585" y2="52" stroke="#a7f3d0" stroke-width="1.5"/>
    
    <text x="30" y="85" font-family="Arial, sans-serif" font-size="13" fill="#047857">REGISTRY OF DEEDS:</text>
    <text x="220" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Quezon City (RD Code: 004)</text>
    
    <text x="30" y="115" font-family="Arial, sans-serif" font-size="13" fill="#047857">EPEB ENTRY TYPE:</text>
    <text x="220" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">CCV (Certified True Copy / Verification)</text>
    
    <text x="30" y="142" font-family="Arial, sans-serif" font-size="13" fill="#047857">EPEB TRANSACTION NO:</text>
    <text x="220" y="142" font-family="Courier, monospace" font-size="18" font-weight="bold" fill="#b91c1c">2023004819</text>
  </g>
  
  <!-- Breakdown Table -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="600" height="35" fill="#e2e8f0"/>
    <text x="20" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">DESCRIPTION</text>
    <text x="400" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">ACCOUNT CODE</text>
    <text x="530" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">AMOUNT</text>
    
    <line x1="0" y1="35" x2="600" y2="35" stroke="#cbd5e1"/>
    
    <text x="20" y="65" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">LRA Legal Research Fee</text>
    <text x="400" y="65" font-family="Courier, monospace" font-size="12" fill="#64748b">LRF-01</text>
    <text x="540" y="65" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">₱ 120.00</text>
    
    <text x="20" y="95" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Issuance of Certified True Copy (TCT-004-2022019482)</text>
    <text x="400" y="95" font-family="Courier, monospace" font-size="12" fill="#64748b">CTC-04</text>
    <text x="540" y="95" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">₱ 360.00</text>
    
    <text x="20" y="125" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">IT Service Fee (Land Registration Systems)</text>
    <text x="400" y="125" font-family="Courier, monospace" font-size="12" fill="#64748b">ITSF-09</text>
    <text x="540" y="125" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">₱ 340.47</text>
    
    <line x1="0" y1="145" x2="600" y2="145" stroke="#cbd5e1" stroke-width="2"/>
    
    <text x="350" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">TOTAL AMOUNT PAID:</text>
    <text x="525" y="175" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#047857">₱ 820.47</text>
  </g>
  
  <!-- Cashier info -->
  <g transform="translate(50, 720)">
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="11" fill="#64748b">COLLECTING OFFICER:</text>
    <text x="20" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">E. RAMOS - CASHIER II</text>
    
    <text x="400" y="25" font-family="Arial, sans-serif" font-size="11" fill="#64748b">TRANSACTION STATUS:</text>
    <text x="400" y="45" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">COMPLETED / ISSUED</text>
  </g>
  
  <!-- Footer instructions -->
  <rect x="50" y="800" width="600" height="45" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
  <text x="350" y="826" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Verify transaction status anytime at https://lots.lra.gov.ph using your EPEB Number.</text>
</svg>

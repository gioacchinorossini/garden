<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <radialGradient id="sealGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#aa7c11" stop-opacity="1"/>
    </radialGradient>
  </defs>
  
  <!-- Parchment Background -->
  <rect width="800" height="1100" fill="#fdfbf7"/>
  
  <!-- Outer Ornate Border -->
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="url(#borderGrad)" stroke-width="8" rx="6"/>
  <rect x="35" y="35" width="730" height="1030" fill="none" stroke="#52b788" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="42" y="42" width="716" height="1016" fill="none" stroke="#2d6a4f" stroke-width="1.5"/>

  <!-- Watermark -->
  <text x="400" y="580" text-anchor="middle" font-family="Arial, serif" font-size="70" font-weight="bold" fill="#2d6a4f" fill-opacity="0.05" transform="rotate(-30 400 580)">CERTIFIED TRUE COPY</text>
  
  <!-- Header -->
  <text x="400" y="90" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="16" letter-spacing="3" fill="#1b4332" font-weight="bold">REPUBLIC OF THE PHILIPPINES</text>
  <text x="400" y="115" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="14" letter-spacing="2" fill="#40916c">DEPARTMENT OF JUSTICE</text>
  <text x="400" y="145" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="22" font-weight="bold" fill="#1b4332" letter-spacing="1">Land Registration Authority</text>
  <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555">REGISTRY OF DEEDS</text>
  
  <!-- Certificate Banner -->
  <rect x="180" y="200" width="440" height="42" rx="6" fill="#2d6a4f"/>
  <text x="400" y="228" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="bold" fill="#ffffff" letter-spacing="2">TRANSFER CERTIFICATE OF TITLE</text>
  <text x="400" y="265" text-anchor="middle" font-family="Courier, monospace" font-size="16" font-weight="bold" fill="#b91c1c">No. 004-2022019482</text>
  
  <!-- Divider -->
  <line x1="80" y1="290" x2="720" y2="290" stroke="#d8f3dc" stroke-width="2"/>
  
  <!-- Body text -->
  <text x="80" y="330" font-family="'Times New Roman', serif" font-size="14" fill="#222">IT IS HEREBY CERTIFIED that certain land situated in the Municipality/City of Quezon City,</text>
  <text x="80" y="355" font-family="'Times New Roman', serif" font-size="14" fill="#222">bounded and described as follows:</text>
  
  <!-- Technical description box -->
  <rect x="80" y="380" width="640" height="210" fill="#ffffff" stroke="#d1d5db" rx="6"/>
  <text x="100" y="415" font-family="Courier, monospace" font-size="12" fill="#374151">"A PARCEL OF LAND (Lot 4-B of the subdivision plan, being a portion</text>
  <text x="100" y="440" font-family="Courier, monospace" font-size="12" fill="#374151">of Lot 4, (LRC) Psd-128492, L.R.C. Record No. 7681), situated in</text>
  <text x="100" y="465" font-family="Courier, monospace" font-size="12" fill="#374151">Sunnyvale District. Bounded on the NE., by Road Lot 2; on the SE.,</text>
  <text x="100" y="490" font-family="Courier, monospace" font-size="12" fill="#374151">by Lot 5; on the SW., by Lot 4-A; and on the NW., by Lot 3.</text>
  <text x="100" y="525" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#1b4332">Beginning at a point marked '1' on plan, containing an area of</text>
  <text x="100" y="550" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#047857">TWO HUNDRED FIFTY (250.00) SQUARE METERS, more or less."</text>
  
  <!-- Owner section -->
  <text x="80" y="630" font-family="'Times New Roman', serif" font-size="14" fill="#222">is registered in accordance with the provisions of the Property Registration Decree in the name of:</text>
  
  <rect x="80" y="650" width="640" height="70" fill="#f0fdf4" stroke="#86efac" rx="6"/>
  <text x="400" y="685" text-anchor="middle" font-family="'Times New Roman', serif" font-size="19" font-weight="bold" fill="#14532d">JOHN LANDOWNER</text>
  <text x="400" y="708" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">Filipino, of legal age, Filipino citizen, Married with full civil capacity.</text>

  <!-- LRA Barcode & Authentication Seal -->
  <g transform="translate(100, 760)">
    <!-- Fake Barcode -->
    <rect x="0" y="0" width="220" height="50" fill="#ffffff" stroke="#e5e7eb"/>
    <line x1="15" y1="10" x2="15" y2="40" stroke="#111" stroke-width="3"/>
    <line x1="22" y1="10" x2="22" y2="40" stroke="#111" stroke-width="1.5"/>
    <line x1="28" y1="10" x2="28" y2="40" stroke="#111" stroke-width="4"/>
    <line x1="36" y1="10" x2="36" y2="40" stroke="#111" stroke-width="2"/>
    <line x1="43" y1="10" x2="43" y2="40" stroke="#111" stroke-width="3.5"/>
    <line x1="53" y1="10" x2="53" y2="40" stroke="#111" stroke-width="1"/>
    <line x1="60" y1="10" x2="60" y2="40" stroke="#111" stroke-width="4"/>
    <line x1="72" y1="10" x2="72" y2="40" stroke="#111" stroke-width="2"/>
    <line x1="82" y1="10" x2="82" y2="40" stroke="#111" stroke-width="3"/>
    <line x1="93" y1="10" x2="93" y2="40" stroke="#111" stroke-width="1.5"/>
    <line x1="102" y1="10" x2="102" y2="40" stroke="#111" stroke-width="4"/>
    <line x1="115" y1="10" x2="115" y2="40" stroke="#111" stroke-width="2"/>
    <line x1="126" y1="10" x2="126" y2="40" stroke="#111" stroke-width="3"/>
    <line x1="138" y1="10" x2="138" y2="40" stroke="#111" stroke-width="1.5"/>
    <line x1="147" y1="10" x2="147" y2="40" stroke="#111" stroke-width="3"/>
    <line x1="160" y1="10" x2="160" y2="40" stroke="#111" stroke-width="2"/>
    <line x1="172" y1="10" x2="172" y2="40" stroke="#111" stroke-width="4"/>
    <line x1="185" y1="10" x2="185" y2="40" stroke="#111" stroke-width="2"/>
    <line x1="198" y1="10" x2="198" y2="40" stroke="#111" stroke-width="3"/>
    <text x="110" y="65" text-anchor="middle" font-family="Courier, monospace" font-size="11" fill="#374151">EPEB-CCV-2023004819</text>
  </g>
  
  <!-- Official Seal -->
  <circle cx="560" cy="800" r="55" fill="url(#sealGrad)" stroke="#78350f" stroke-width="3"/>
  <circle cx="560" cy="800" r="46" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="560" y="792" text-anchor="middle" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#78350f" letter-spacing="1">LAND REGISTRATION</text>
  <text x="560" y="806" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#ffffff">OFFICIAL SEAL</text>
  <text x="560" y="820" text-anchor="middle" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#78350f">AUTHORITY</text>
  
  <!-- Signatures -->
  <line x1="430" y1="940" x2="690" y2="940" stroke="#111" stroke-width="1.5"/>
  <text x="560" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111">ATTY. MARCELO D. SANTOS</text>
  <text x="560" y="978" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Register of Deeds, Quezon City</text>
  
  <!-- Footer Note -->
  <rect x="50" y="1010" width="700" height="40" fill="#f3f4f6" rx="4"/>
  <text x="400" y="1035" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">This electronic copy is certified true and correct under LRA LOTS Verification No. 2023004819.</text>
</svg>

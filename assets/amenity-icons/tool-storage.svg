<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Amenity Icon: Tool Storage Shed -->
  <defs>
    <filter id="shedGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#3e2723" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Grass Ground Base -->
  <ellipse cx="32" cy="58" rx="24" ry="4.5" fill="#2E7D32" opacity="0.4"/>
  <ellipse cx="32" cy="57" rx="22" ry="3.5" fill="#4CAF50"/>

  <!-- Shed Main Wooden Structure -->
  <g id="shedBody" filter="url(#shedGlow)">
    <!-- Back shadow contour -->
    <rect x="14" y="24" width="36" height="32" rx="4" fill="#3E2723"/>
    <!-- Wooden wall plank base -->
    <rect x="15" y="25" width="34" height="30" rx="3" fill="#8D6E63"/>

    <!-- Horizontal wood plank slats -->
    <rect x="16" y="26" width="32" height="6.5" rx="1.5" fill="#A1887F"/>
    <rect x="16" y="33.5" width="32" height="6.5" rx="1.5" fill="#BCAAA4"/>
    <rect x="16" y="41" width="32" height="6.5" rx="1.5" fill="#A1887F"/>
    <rect x="16" y="48.5" width="32" height="6.5" rx="1.5" fill="#8D6E63"/>

    <!-- Shed Door -->
    <rect x="24" y="32" width="16" height="23" rx="2" fill="#4E342E"/>
    <rect x="25" y="33" width="14" height="21" rx="1.5" fill="#6D4C41"/>
    <!-- Door diagonal brace -->
    <line x1="26" y1="35" x2="38" y2="52" stroke="#4E342E" stroke-width="2"/>
    <!-- Door knob -->
    <circle cx="36" cy="44" r="1.8" fill="#F59E0B"/>
    <circle cx="35.6" cy="43.6" r="0.7" fill="#FFFBEB"/>

    <!-- Door window arch -->
    <path d="M 28 35 C 28 34 30 33 32 33 C 34 33 36 34 36 35 L 36 37 L 28 37 Z" fill="#81D4FA"/>
    <path d="M 29 35 C 29 34.5 30.5 34 32 34 C 33.5 34 35 34.5 35 35 L 35 36.5 L 29 36.5 Z" fill="#E1F5FE"/>
  </g>

  <!-- Pitched Green Timber Roof -->
  <g id="roof">
    <!-- Roof shadow contour -->
    <path d="M 32 8 L 8 26 L 13 28 L 32 13 L 51 28 L 56 26 Z" fill="#1B5E20"/>
    <!-- Roof main emerald green tiles -->
    <path d="M 32 9 L 9 26 L 13 27.5 L 32 12.5 L 51 27.5 L 55 26 Z" fill="#2E7D32"/>
    <!-- Roof front pediment triangular gable -->
    <path d="M 32 14 L 17 25 L 47 25 Z" fill="#4CAF50"/>
    <!-- Roof fascia highlight -->
    <path d="M 32 10.5 L 12 25" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Leaning Garden Spade / Shovel -->
  <g id="shovel">
    <!-- Handle wood shaft -->
    <line x1="49" y1="28" x2="55" y2="54" stroke="#5D4037" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="49" y1="28" x2="55" y2="54" stroke="#D7CCC8" stroke-width="1.2" stroke-linecap="round"/>
    <!-- D-Handle grip -->
    <path d="M 47 27 C 47 25 50 25 51 27 L 50 29 Z" fill="#FF8F00"/>
    <!-- Metal spade blade -->
    <path d="M 53 47 L 57 48 L 55 57 C 53.5 57 52.5 54 53 47 Z" fill="#37474F"/>
    <path d="M 53.5 48 L 56.5 49 L 55 56 Z" fill="#90A4AE"/>
    <line x1="54" y1="49" x2="54.5" y2="54" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Amenity Icon: Restroom & Wash Area -->
  <defs>
    <filter id="restroomGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#00695c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Mound -->
  <ellipse cx="32" cy="58" rx="24" ry="4" fill="#2E7D32" opacity="0.4"/>
  <ellipse cx="32" cy="57" rx="22" ry="3" fill="#4CAF50"/>

  <!-- Cabin Structure (Shadow) -->
  <rect x="16" y="20" width="32" height="36" rx="4" fill="#37474F"/>
  <!-- Cabin Wall (Warm Clean Off-White) -->
  <rect x="17" y="21" width="30" height="34" rx="3" fill="#ECEFF1"/>

  <!-- Slanted Roof -->
  <path d="M 32 6 L 10 22 L 14 24 L 32 10 L 50 24 L 54 22 Z" fill="#004D40"/>
  <path d="M 32 7.5 L 11 22 L 14 23.5 L 32 9.5 L 50 23.5 L 53 22 Z" fill="#00897B"/>
  <path d="M 32 10 L 17 21 L 47 21 Z" fill="#4DB6AC"/>
  <path d="M 32 9 L 14 22" stroke="#E0F2F1" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>

  <!-- Cabin Door -->
  <rect x="23" y="28" width="18" height="27" rx="2" fill="#78909C"/>
  <rect x="24" y="29" width="16" height="25" rx="1.5" fill="#CFD8DC"/>
  <!-- Door knob -->
  <circle cx="36" cy="42" r="1.5" fill="#F59E0B"/>

  <!-- Restroom / Wash Symbol Plaque above door -->
  <rect x="26" y="22" width="12" height="5" rx="1.5" fill="#00695C"/>
  <!-- Gender / Wash Figure icons -->
  <circle cx="29.5" cy="23.5" r="0.8" fill="#FFFFFF"/>
  <rect x="29" y="24.8" width="1" height="1.4" fill="#FFFFFF"/>
  <circle cx="34.5" cy="23.5" r="0.8" fill="#FFFFFF"/>
  <path d="M 34.5 24.8 L 33.7 26.2 L 35.3 26.2 Z" fill="#FFFFFF"/>

  <!-- Sparkling Wash Basin / Water Bubbles Overlay -->
  <g id="washStation" filter="url(#restroomGlow)">
    <!-- Round ceramic basin -->
    <ellipse cx="44" cy="47" rx="9" ry="5.5" fill="#0277BD"/>
    <ellipse cx="44" cy="46" rx="8" ry="4.5" fill="#E1F5FE"/>
    <ellipse cx="44" cy="46.5" rx="6.5" ry="3" fill="#0288D1"/>
    <!-- Water highlight -->
    <path d="M 40 46 C 42 45 46 45 48 46" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Basin chrome faucet -->
    <path d="M 44 43 L 44 38 C 44 36 42 36 42 37" stroke="#455A64" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 44 43 L 44 38 C 44 36 42 36 42 37" stroke="#B0BEC5" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Clean Soap Foam / Water Droplets -->
    <circle cx="49" cy="38" r="2.2" fill="#81D4FA"/>
    <circle cx="48.5" cy="37.5" r="0.8" fill="#FFFFFF"/>
    <circle cx="42" cy="35" r="1.6" fill="#B3E5FC"/>
    <circle cx="41.6" cy="34.6" r="0.6" fill="#FFFFFF"/>
  </g>
</svg>


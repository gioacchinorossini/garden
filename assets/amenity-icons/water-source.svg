<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Amenity Icon: Water Source -->
  <defs>
    <filter id="waterGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0277bd" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Brass Pipe & Spigot Stem -->
  <g id="spigot">
    <!-- Back pipe flange -->
    <rect x="6" y="14" width="6" height="14" rx="2" fill="#5D4037"/>
    <rect x="7" y="15" width="4" height="12" rx="1.5" fill="#8D6E63"/>
    
    <!-- Pipe body -->
    <path d="M 12 17 L 28 17 C 32 17 35 20 35 24 L 35 27 L 23 27 C 20 27 18 25 18 22 L 12 22 Z" fill="#5D4037"/>
    <path d="M 12 18 L 27 18 C 30 18 33 21 33 24 L 33 26 L 24 26 C 21 26 19 24 19 21 L 12 21 Z" fill="#BCAAA4"/>
    <path d="M 13 19 L 26 19 C 28 19 31 21 31 23" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Tap handle top stem & crossbar -->
    <rect x="22" y="8" width="6" height="7" rx="1.5" fill="#3E2723"/>
    <rect x="23" y="9" width="4" height="5" rx="1" fill="#6D4C41"/>
    <!-- Handle wheel / cross -->
    <rect x="15" y="5" width="20" height="6" rx="3" fill="#D32F2F"/>
    <rect x="16" y="6" width="18" height="4" rx="2" fill="#EF5350"/>
    <circle cx="25" cy="8" r="2" fill="#B71C1C"/>
    <path d="M 18 7 L 32 7" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

    <!-- Spigot Nozzle -->
    <path d="M 23 27 L 35 27 L 33 33 L 25 33 Z" fill="#4E342E"/>
    <path d="M 24 28 L 34 28 L 32.5 32 L 25.5 32 Z" fill="#8D6E63"/>
  </g>

  <!-- Giant Crystalline Water Droplet -->
  <g id="droplet" filter="url(#waterGlow)">
    <!-- Droplet outer contour shadow -->
    <path d="M 29 32 C 29 32 49 46 49 53 C 49 59.5 43.5 63 36.5 63 C 29.5 63 24 59.5 24 53 C 24 46 29 32 29 32 Z" fill="#01579B"/>
    <!-- Droplet main body -->
    <path d="M 29 33.5 C 29 33.5 47.5 47 47.5 53 C 47.5 58.5 42.5 61.5 36.5 61.5 C 30.5 61.5 25.5 58.5 25.5 53 C 25.5 47 29 33.5 29 33.5 Z" fill="#0288D1"/>
    <!-- Inner cyan highlight body -->
    <path d="M 29.5 36 C 30 38 45 49 45 53 C 45 56.5 41 59 36.5 59 C 32 59 28 56.5 28 53 C 28 49 29.5 36 29.5 36 Z" fill="#29B6F6"/>
    <!-- Soft light center core -->
    <ellipse cx="36" cy="53" rx="6" ry="4" fill="#81D4FA" opacity="0.7"/>

    <!-- Glossy reflection curve & specular dots -->
    <path d="M 29 44 C 27.5 48 27.5 54 31 57" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95"/>
    <circle cx="30" cy="41" r="1.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="42" cy="56" r="1.2" fill="#FFFFFF" opacity="0.75"/>
  </g>

  <!-- Small secondary splash bead -->
  <circle cx="51" cy="44" r="2.5" fill="#0288D1"/>
  <circle cx="51" cy="44" r="1.8" fill="#4FC3F7"/>
  <circle cx="50.4" cy="43.4" r="0.7" fill="#FFFFFF"/>
</svg>


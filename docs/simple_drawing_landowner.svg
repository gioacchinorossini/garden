<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" width="760" height="980" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="s-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="s-arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Outline Border & Header -->
  <rect x="15" y="15" width="730" height="950" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="48" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">Figure 3.2.1a: Landowner Process Flowchart (Simple Line Drawing)</text>
  <line x1="30" y1="65" x2="730" y2="65" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 1. Start -->
  <rect x="300" y="85" width="160" height="42" rx="21" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="111" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">START</text>

  <line x1="380" y1="127" x2="380" y2="155" stroke="#1e293b" stroke-width="2" marker-end="url(#s-arrow)"/>

  <!-- 2. Login / Register -->
  <polygon points="380,155 465,190 380,225 295,190" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="187" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Has Account?</text>
  <text x="380" y="201" fill="#475569" font-size="10" text-anchor="middle">Registered</text>

  <!-- Register (No) -->
  <line x1="295" y1="190" x2="190" y2="190" stroke="#1e293b" stroke-width="1.5" marker-end="url(#s-arrow)"/>
  <text x="235" y="182" fill="#0f172a" font-size="11" font-weight="600">No</text>
  
  <rect x="80" y="168" width="110" height="44" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="135" y="187" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Register Account</text>
  <text x="135" y="201" fill="#475569" font-size="9" text-anchor="middle">(Save to users)</text>

  <line x1="135" y1="212" x2="135" y2="245" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="135" y1="245" x2="380" y2="245" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="380" y1="225" x2="380" y2="265" stroke="#1e293b" stroke-width="2" marker-end="url(#s-arrow)"/>
  <text x="390" y="238" fill="#0f172a" font-size="11" font-weight="600">Yes</text>

  <!-- 3. Landowner Login -->
  <rect x="290" y="265" width="180" height="42" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="291" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Landowner Login</text>

  <line x1="380" y1="307" x2="380" y2="335" stroke="#1e293b" stroke-width="2" marker-end="url(#s-arrow)"/>

  <!-- 4. Land Registration -->
  <rect x="260" y="335" width="240" height="46" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="355" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Input Land Info &amp; Coordinates</text>
  <text x="380" y="371" fill="#475569" font-size="10" text-anchor="middle">Title, Area, Address, Leaflet Pin</text>

  <line x1="380" y1="381" x2="380" y2="408" stroke="#1e293b" stroke-width="2" marker-end="url(#s-arrow)"/>

  <!-- 5. LRA Documents & Plots -->
  <rect x="260" y="408" width="240" height="46" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="428" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Upload LRA Documents &amp; Add Plots</text>
  <text x="380" y="444" fill="#475569" font-size="10" text-anchor="middle">TCT/OCT, EPEB No, Scanned Deeds</text>

  <line x1="380" y1="454" x2="380" y2="480" stroke="#1e293b" stroke-width="2" marker-end="url(#s-arrow)"/>

  <!-- 6. Decision: Admin Verification -->
  <polygon points="380,480 470,515 380,550 290,515" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="512" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Admin Approved?</text>
  <text x="380" y="525" fill="#475569" font-size="9" text-anchor="middle">LRA Audit Check</text>

  <!-- Rejected -> Edit -->
  <line x1="290" y1="515" x2="210" y2="515" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="210" y1="515" x2="210" y2="358" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="210" y1="358" x2="260" y2="358" stroke="#1e293b" stroke-width="1.5" marker-end="url(#s-arrow)"/>
  <text x="220" y="505" fill="#0f172a" font-size="10" font-weight="600">No (Revise)</text>

  <!-- Approved -> Published -->
  <line x1="380" y1="550" x2="380" y2="580" stroke="#1e293b" stroke-width="2" marker-end="url(#s-arrow)"/>
  <text x="390" y="568" fill="#0f172a" font-size="11" font-weight="600">Yes</text>

  <rect x="270" y="580" width="220" height="42" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="601" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Land Published &amp; Visible</text>
  <text x="380" y="615" fill="#475569" font-size="10" text-anchor="middle">Gardeners can view on map</text>

  <line x1="380" y1="622" x2="380" y2="650" stroke="#1e293b" stroke-width="2" marker-end="url(#s-arrow)"/>

  <!-- 7. Decision: Inbound Gardener Request -->
  <polygon points="380,650 470,685 380,720 290,685" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="682" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Incoming Request?</text>
  <text x="380" y="695" fill="#475569" font-size="9" text-anchor="middle">Gardener applied</text>

  <!-- No Request -> Schedule Activities -->
  <line x1="470" y1="685" x2="570" y2="685" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="570" y1="685" x2="570" y2="780" stroke="#1e293b" stroke-width="1.5" marker-end="url(#s-arrow)"/>
  <text x="490" y="677" fill="#0f172a" font-size="10" font-weight="600">No</text>

  <!-- Yes -> Review Request -->
  <line x1="380" y1="720" x2="380" y2="750" stroke="#1e293b" stroke-width="2" marker-end="url(#s-arrow)"/>
  <text x="390" y="738" fill="#0f172a" font-size="11" font-weight="600">Yes</text>

  <rect x="280" y="750" width="200" height="42" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="771" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Review &amp; Approve / Reject</text>
  <text x="380" y="785" fill="#475569" font-size="10" text-anchor="middle">Update plot status to 'occupied'</text>

  <!-- 8. Schedule Gardening Activities -->
  <line x1="380" y1="792" x2="380" y2="820" stroke="#1e293b" stroke-width="2"/>
  <line x1="570" y1="820" x2="380" y2="820" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="380" y1="820" x2="380" y2="840" stroke="#1e293b" stroke-width="2" marker-end="url(#s-arrow)"/>

  <rect x="270" y="840" width="220" height="42" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="861" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Create / Manage Schedules</text>
  <text x="380" y="875" fill="#475569" font-size="10" text-anchor="middle">Planting, Watering, Weeding</text>

  <line x1="380" y1="882" x2="380" y2="910" stroke="#1e293b" stroke-width="2" marker-end="url(#s-arrow)"/>

  <!-- 9. End -->
  <rect x="300" y="910" width="160" height="42" rx="21" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="936" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">END / LOGOUT</text>
</svg>

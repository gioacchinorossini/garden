<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1380" width="1000" height="1380" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="20" width="940" height="65" rx="12" fill="#0f172a"/>
  <text x="500" y="48" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Figure 3.2.1: Landowner Process Flowchart</text>
  <text x="500" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">Idle Land for Community Gardening System</text>

  <!-- Flowchart Group -->
  <!-- Start -->
  <rect x="410" y="110" width="180" height="46" rx="23" fill="#10b981" filter="url(#shadow)"/>
  <text x="500" y="139" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Start: Landowner Access</text>

  <line x1="500" y1="156" x2="500" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Has Account? -->
  <polygon points="500,190 590,230 500,270 410,230" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="226" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">Has Account?</text>
  <text x="500" y="242" fill="#92400e" font-size="11" text-anchor="middle">Already registered</text>

  <!-- No Branch -> Register -->
  <line x1="410" y1="230" x2="250" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="222" fill="#b45309" font-size="12" font-weight="700">No</text>

  <rect x="110" y="202" width="140" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="225" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Register Account</text>
  <text x="180" y="243" fill="#64748b" font-size="11" text-anchor="middle">Name, Email, Phone</text>

  <line x1="180" y1="258" x2="180" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="300" width="160" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="322" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">Database Storage</text>
  <text x="180" y="338" fill="#3b82f6" font-size="11" text-anchor="middle">Insert into users table</text>

  <!-- Connector from Register back to Login -->
  <path d="M 260 325 L 340 325 L 340 325" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="260" y1="325" x2="410" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Yes Branch -> Login -->
  <line x1="500" y1="270" x2="500" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="288" fill="#059669" font-size="12" font-weight="700">Yes</text>

  <!-- Login Box -->
  <rect x="410" y="300" width="180" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="323" fill="#1e293b" font-size="13" font-weight="600" text-anchor="middle">Landowner Login</text>
  <text x="500" y="339" fill="#64748b" font-size="11" text-anchor="middle">Verify Email &amp; Password</text>

  <line x1="500" y1="350" x2="500" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <rect x="390" y="380" width="220" height="46" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="408" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Landowner Dashboard</text>

  <!-- 3 Branches Split Line -->
  <line x1="500" y1="426" x2="500" y2="455" stroke="#475569" stroke-width="2"/>
  <line x1="190" y1="455" x2="810" y2="455" stroke="#475569" stroke-width="2"/>
  <line x1="190" y1="455" x2="190" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="455" x2="500" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="455" x2="810" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Subflow 1: Land Registration (Left) -->
  <rect x="70" y="480" width="240" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="190" y="505" fill="#15803d" font-size="13" font-weight="700" text-anchor="middle">A. Register New Land</text>

  <line x1="190" y1="520" x2="190" y2="545" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="545" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="567" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Input Property Info</text>
  <text x="190" y="583" fill="#64748b" font-size="11" text-anchor="middle">Title, Address, Total Area (sqm)</text>

  <line x1="190" y1="595" x2="190" y2="620" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="620" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="642" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Pin Geolocation Coordinates</text>
  <text x="190" y="658" fill="#64748b" font-size="11" text-anchor="middle">Leaflet Map (Lat / Long)</text>

  <line x1="190" y1="670" x2="190" y2="695" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="695" width="220" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="716" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Upload LRA Legal Docs</text>
  <text x="190" y="732" fill="#64748b" font-size="11" text-anchor="middle">TCT/OCT, EPEB No., ROD Name</text>
  <text x="190" y="746" fill="#64748b" font-size="10" text-anchor="middle">Scan of Title CTC &amp; Official Receipt</text>

  <line x1="190" y1="755" x2="190" y2="780" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="780" width="220" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="802" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Define Plot Subdivision</text>
  <text x="190" y="818" fill="#64748b" font-size="11" text-anchor="middle">Plot numbers &amp; area dimensions</text>

  <line x1="190" y1="828" x2="190" y2="850" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="850" width="220" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="871" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">Save to lands &amp; plots</text>
  <text x="190" y="887" fill="#3b82f6" font-size="11" text-anchor="middle">Initial status = 'pending'</text>

  <line x1="190" y1="898" x2="190" y2="925" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Admin Verification -->
  <polygon points="190,925 285,965 190,1005 95,965" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="960" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">Admin Verified?</text>
  <text x="190" y="976" fill="#92400e" font-size="10" text-anchor="middle">LRA Audit Check</text>

  <!-- Admin Rejected -->
  <line x1="95" y1="965" x2="45" y2="965" stroke="#dc2626" stroke-width="2"/>
  <line x1="45" y1="965" x2="45" y2="570" stroke="#dc2626" stroke-width="2"/>
  <line x1="45" y1="570" x2="80" y2="570" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="50" y="955" fill="#dc2626" font-size="11" font-weight="700">Rejected</text>

  <!-- Admin Approved -->
  <line x1="190" y1="1005" x2="190" y2="1040" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="200" y="1025" fill="#059669" font-size="11" font-weight="700">Approved</text>

  <rect x="80" y="1040" width="220" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="1062" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">Published &amp; Active</text>
  <text x="190" y="1078" fill="#059669" font-size="11" text-anchor="middle">Visible to Gardeners on Map</text>


  <!-- Subflow 2: Manage Plot Requests (Middle) -->
  <rect x="380" y="480" width="240" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="505" fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle">B. Manage Plot Requests</text>

  <line x1="500" y1="520" x2="500" y2="550" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="390" y="550" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="572" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Fetch Pending Requests</text>
  <text x="500" y="588" fill="#64748b" font-size="11" text-anchor="middle">Query requests table</text>

  <line x1="500" y1="600" x2="500" y2="630" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="390" y="630" width="220" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="652" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Inspect Application Details</text>
  <text x="500" y="668" fill="#64748b" font-size="11" text-anchor="middle">Gardener info, planned crops,</text>
  <text x="500" y="682" fill="#64748b" font-size="10" text-anchor="middle">farming purpose &amp; duration</text>

  <line x1="500" y1="690" x2="500" y2="720" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Landowner Decision -->
  <polygon points="500,720 590,760 500,800 410,760" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="756" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">Accept Request?</text>
  <text x="500" y="772" fill="#92400e" font-size="10" text-anchor="middle">Evaluate Fit</text>

  <!-- Deny -->
  <line x1="410" y1="760" x2="350" y2="760" stroke="#dc2626" stroke-width="2"/>
  <line x1="350" y1="760" x2="350" y2="830" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="360" y="752" fill="#dc2626" font-size="11" font-weight="700">Deny</text>

  <rect x="310" y="830" width="130" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="375" y="852" fill="#b91c1c" font-size="12" font-weight="600" text-anchor="middle">Reject Request</text>
  <text x="375" y="868" fill="#ef4444" font-size="10" text-anchor="middle">Status = 'rejected'</text>

  <!-- Grant -->
  <line x1="500" y1="800" x2="500" y2="830" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="510" y="818" fill="#059669" font-size="11" font-weight="700">Approve</text>

  <rect x="445" y="830" width="150" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="520" y="851" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">Approve &amp; Assign</text>
  <text x="520" y="867" fill="#059669" font-size="10" text-anchor="middle">Plot status = 'occupied'</text>

  <!-- Join back to request completed -->
  <line x1="375" y1="880" x2="375" y2="910" stroke="#475569" stroke-width="1.5"/>
  <line x1="520" y1="880" x2="520" y2="910" stroke="#475569" stroke-width="1.5"/>
  <line x1="375" y1="910" x2="520" y2="910" stroke="#475569" stroke-width="1.5"/>
  <line x1="450" y1="910" x2="450" y2="940" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="370" y="940" width="160" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="965" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">Gardener Notified in Portal</text>


  <!-- Subflow 3: Schedule Management (Right) -->
  <rect x="690" y="480" width="240" height="40" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="810" y="505" fill="#7e22ce" font-size="13" font-weight="700" text-anchor="middle">C. Manage Garden Activities</text>

  <line x1="810" y1="520" x2="810" y2="550" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="550" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="572" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Create Schedule / Event</text>
  <text x="810" y="588" fill="#64748b" font-size="11" text-anchor="middle">Select Land &amp; Plot</text>

  <line x1="810" y1="600" x2="810" y2="630" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="630" width="220" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="652" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Define Task Specifications</text>
  <text x="810" y="668" fill="#64748b" font-size="11" text-anchor="middle">Task Type: planting, watering,</text>
  <text x="810" y="682" fill="#64748b" font-size="10" text-anchor="middle">weeding, harvest date, time</text>

  <line x1="810" y1="690" x2="810" y2="720" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="720" width="220" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="741" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">Save to schedules table</text>
  <text x="810" y="757" fill="#3b82f6" font-size="11" text-anchor="middle">Sync with community calendar</text>

  <line x1="810" y1="768" x2="810" y2="800" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="800" width="220" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="825" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">Visible to Assigned Gardeners</text>


  <!-- Bottom Connectors to Return / Finish -->
  <line x1="190" y1="1090" x2="190" y2="1140" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="980" x2="450" y2="1140" stroke="#475569" stroke-width="2"/>
  <line x1="810" y1="840" x2="810" y2="1140" stroke="#475569" stroke-width="2"/>

  <line x1="190" y1="1140" x2="810" y2="1140" stroke="#475569" stroke-width="2"/>
  <line x1="500" y1="1140" x2="500" y2="1170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Continue or Logout -->
  <polygon points="500,1170 590,1210 500,1250 410,1210" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="1206" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">Continue Session?</text>
  <text x="500" y="1222" fill="#92400e" font-size="10" text-anchor="middle">More operations</text>

  <!-- Loop back to Dashboard -->
  <line x1="590" y1="1210" x2="960" y2="1210" stroke="#475569" stroke-width="2"/>
  <line x1="960" y1="1210" x2="960" y2="403" stroke="#475569" stroke-width="2"/>
  <line x1="960" y1="403" x2="610" y2="403" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="890" y="1202" fill="#475569" font-size="12" font-weight="700">Yes</text>

  <!-- End / Logout -->
  <line x1="500" y1="1250" x2="500" y2="1285" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="1270" fill="#dc2626" font-size="12" font-weight="700">No</text>

  <rect x="420" y="1285" width="160" height="46" rx="23" fill="#64748b" filter="url(#shadow)"/>
  <text x="500" y="1313" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">End: Logout</text>
</svg>

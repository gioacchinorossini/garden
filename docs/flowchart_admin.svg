<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1380" width="1000" height="1380" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="shadow-a" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="20" width="940" height="65" rx="12" fill="#1e1b4b"/>
  <text x="500" y="48" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Figure 3.2.3: Administrator Process Flowchart</text>
  <text x="500" y="70" fill="#c7d2fe" font-size="13" text-anchor="middle">Idle Land for Community Gardening System - Verification &amp; Governance</text>

  <!-- Start -->
  <rect x="400" y="110" width="200" height="46" rx="23" fill="#4f46e5" filter="url(#shadow-a)"/>
  <text x="500" y="139" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Start: Administrator Access</text>

  <line x1="500" y1="156" x2="500" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <!-- Admin Login Box -->
  <rect x="380" y="195" width="240" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="500" y="219" fill="#1e293b" font-size="13" font-weight="600" text-anchor="middle">Admin Secure Login</text>
  <text x="500" y="237" fill="#64748b" font-size="11" text-anchor="middle">Verify Role = 'admin' &amp; Password Hash</text>

  <line x1="500" y1="249" x2="500" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <!-- Dashboard -->
  <rect x="370" y="285" width="260" height="50" rx="8" fill="#312e81" stroke="#1e1b4b" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="500" y="309" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Admin Control Center</text>
  <text x="500" y="325" fill="#c7d2fe" font-size="11" text-anchor="middle">Overview Metrics, Verifications &amp; Alerts</text>

  <!-- 3 Branches Split Line -->
  <line x1="500" y1="335" x2="500" y2="375" stroke="#475569" stroke-width="2"/>
  <line x1="190" y1="375" x2="810" y2="375" stroke="#475569" stroke-width="2"/>
  <line x1="190" y1="375" x2="190" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>
  <line x1="500" y1="375" x2="500" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>
  <line x1="810" y1="375" x2="810" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <!-- Subflow 1: Land Title Verification (Left) -->
  <rect x="60" y="410" width="260" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="436" fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle">A. Land &amp; LRA Title Audit</text>

  <line x1="190" y1="452" x2="190" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="75" y="480" width="230" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="190" y="502" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Fetch Pending Submissions</text>
  <text x="190" y="518" fill="#64748b" font-size="11" text-anchor="middle">SELECT * FROM lands WHERE status='pending'</text>

  <line x1="190" y1="530" x2="190" y2="560" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="75" y="560" width="230" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="190" y="582" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Inspect Physical Property Data</text>
  <text x="190" y="598" fill="#64748b" font-size="11" text-anchor="middle">Leaflet Coordinates, Address, Area (sqm)</text>

  <line x1="190" y1="615" x2="190" y2="645" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="75" y="645" width="230" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="190" y="666" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Audit LRA Documentation</text>
  <text x="190" y="682" fill="#64748b" font-size="11" text-anchor="middle">Title Type TCT/OCT, EPEB No,</text>
  <text x="190" y="696" fill="#64748b" font-size="10" text-anchor="middle">ROD Branch, Title CTC &amp; Official Receipt</text>

  <line x1="190" y1="710" x2="190" y2="745" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <!-- Decision: LRA Valid? -->
  <polygon points="190,745 285,785 190,825 95,785" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow-a)"/>
  <text x="190" y="780" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">Title Legitimate?</text>
  <text x="190" y="796" fill="#92400e" font-size="10" text-anchor="middle">LRA LOTS Check</text>

  <!-- Rejected -->
  <line x1="95" y1="785" x2="40" y2="785" stroke="#dc2626" stroke-width="2"/>
  <line x1="40" y1="785" x2="40" y2="865" stroke="#dc2626" stroke-width="2"/>
  <line x1="40" y1="865" x2="80" y2="865" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red-a)"/>
  <text x="45" y="775" fill="#dc2626" font-size="11" font-weight="700">Invalid</text>

  <rect x="80" y="840" width="105" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="132" y="862" fill="#b91c1c" font-size="11" font-weight="600" text-anchor="middle">Reject Listing</text>
  <text x="132" y="878" fill="#ef4444" font-size="10" text-anchor="middle">Record reason</text>

  <!-- Approved -->
  <line x1="285" y1="785" x2="335" y2="785" stroke="#059669" stroke-width="2"/>
  <line x1="335" y1="785" x2="335" y2="865" stroke="#059669" stroke-width="2"/>
  <line x1="335" y1="865" x2="300" y2="865" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green-a)"/>
  <text x="295" y="775" fill="#059669" font-size="11" font-weight="700">Valid</text>

  <rect x="195" y="840" width="105" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="247" y="862" fill="#065f46" font-size="11" font-weight="600" text-anchor="middle">Approve Title</text>
  <text x="247" y="878" fill="#059669" font-size="10" text-anchor="middle">Verified = 1</text>

  <!-- Convergence to DB Update -->
  <line x1="132" y1="890" x2="132" y2="920" stroke="#475569" stroke-width="1.5"/>
  <line x1="247" y1="890" x2="247" y2="920" stroke="#475569" stroke-width="1.5"/>
  <line x1="132" y1="920" x2="247" y2="920" stroke="#475569" stroke-width="1.5"/>
  <line x1="190" y1="920" x2="190" y2="950" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="75" y="950" width="230" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="190" y="972" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">Update lands Database Table</text>
  <text x="190" y="988" fill="#3b82f6" font-size="11" text-anchor="middle">Set status &amp; notify landowner</text>


  <!-- Subflow 2: User Account Governance (Middle) -->
  <rect x="375" y="410" width="250" height="42" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="500" y="436" fill="#7e22ce" font-size="13" font-weight="700" text-anchor="middle">B. User Account Governance</text>

  <line x1="500" y1="452" x2="500" y2="485" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="385" y="485" width="230" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="500" y="507" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Load Registered Accounts</text>
  <text x="500" y="523" fill="#64748b" font-size="11" text-anchor="middle">Filter by Landowner or Gardener</text>

  <line x1="500" y1="535" x2="500" y2="570" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="385" y="570" width="230" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="500" y="592" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Audit User Profile &amp; History</text>
  <text x="500" y="608" fill="#64748b" font-size="11" text-anchor="middle">Active listings, requests, participation</text>

  <line x1="500" y1="625" x2="500" y2="665" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <!-- Decision: User Status -->
  <polygon points="500,665 590,705 500,745 410,705" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow-a)"/>
  <text x="500" y="700" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">Account Standing?</text>
  <text x="500" y="716" fill="#92400e" font-size="10" text-anchor="middle">Policy Compliance</text>

  <!-- Suspend -->
  <line x1="410" y1="705" x2="355" y2="705" stroke="#dc2626" stroke-width="2"/>
  <line x1="355" y1="705" x2="355" y2="780" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red-a)"/>
  <text x="365" y="695" fill="#dc2626" font-size="11" font-weight="700">Violation</text>

  <rect x="310" y="780" width="95" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="357" y="802" fill="#b91c1c" font-size="11" font-weight="600" text-anchor="middle">Suspend</text>
  <text x="357" y="818" fill="#ef4444" font-size="10" text-anchor="middle">status='inactive'</text>

  <!-- Active / Keep -->
  <line x1="590" y1="705" x2="645" y2="705" stroke="#059669" stroke-width="2"/>
  <line x1="645" y1="705" x2="645" y2="780" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green-a)"/>
  <text x="600" y="695" fill="#059669" font-size="11" font-weight="700">Good</text>

  <rect x="595" y="780" width="100" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="645" y="802" fill="#065f46" font-size="11" font-weight="600" text-anchor="middle">Maintain</text>
  <text x="645" y="818" fill="#059669" font-size="10" text-anchor="middle">status='active'</text>

  <!-- Join back to User DB -->
  <line x1="357" y1="830" x2="357" y2="865" stroke="#475569" stroke-width="1.5"/>
  <line x1="645" y1="830" x2="645" y2="865" stroke="#475569" stroke-width="1.5"/>
  <line x1="357" y1="865" x2="645" y2="865" stroke="#475569" stroke-width="1.5"/>
  <line x1="500" y1="865" x2="500" y2="900" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="385" y="900" width="230" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="500" y="922" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">Save Changes to users</text>
  <text x="500" y="938" fill="#3b82f6" font-size="11" text-anchor="middle">Enforce access controls</text>


  <!-- Subflow 3: Analytics & Reports (Right) -->
  <rect x="690" y="410" width="240" height="42" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="810" y="436" fill="#065f46" font-size="13" font-weight="700" text-anchor="middle">C. Intelligence &amp; Reporting</text>

  <line x1="810" y1="452" x2="810" y2="485" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="695" y="485" width="230" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="810" y="507" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Select Reporting Metrics</text>
  <text x="810" y="523" fill="#64748b" font-size="11" text-anchor="middle">Filter by Date, Location, Crop</text>

  <line x1="810" y1="535" x2="810" y2="570" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="695" y="570" width="230" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="810" y="591" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Cross-Entity Aggregation</text>
  <text x="810" y="607" fill="#64748b" font-size="11" text-anchor="middle">Join lands, plots, requests,</text>
  <text x="810" y="621" fill="#64748b" font-size="10" text-anchor="middle">harvests &amp; users tables</text>

  <line x1="810" y1="630" x2="810" y2="670" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="695" y="670" width="230" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="810" y="692" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Compute Core KPIs</text>
  <text x="810" y="708" fill="#64748b" font-size="11" text-anchor="middle">Land conversion sqm, total yield kg,</text>
  <text x="810" y="720" fill="#64748b" font-size="10" text-anchor="middle">plot occupancy percentage</text>

  <line x1="810" y1="725" x2="810" y2="765" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="695" y="765" width="230" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="810" y="787" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">Render Charts &amp; Tables</text>
  <text x="810" y="803" fill="#3b82f6" font-size="11" text-anchor="middle">Generate Visual Dashboards</text>

  <line x1="810" y1="815" x2="810" y2="855" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <rect x="695" y="855" width="230" height="45" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-a)"/>
  <text x="810" y="882" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Export PDF / Print Reports</text>


  <!-- Bottom Connectors to Return / Finish -->
  <line x1="190" y1="1000" x2="190" y2="1080" stroke="#475569" stroke-width="2"/>
  <line x1="500" y1="950" x2="500" y2="1080" stroke="#475569" stroke-width="2"/>
  <line x1="810" y1="900" x2="810" y2="1080" stroke="#475569" stroke-width="2"/>

  <line x1="190" y1="1080" x2="810" y2="1080" stroke="#475569" stroke-width="2"/>
  <line x1="500" y1="1080" x2="500" y2="1115" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>

  <!-- Decision: Continue Admin Session -->
  <polygon points="500,1115 590,1155 500,1195 410,1155" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow-a)"/>
  <text x="500" y="1151" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">More Admin Tasks?</text>
  <text x="500" y="1167" fill="#92400e" font-size="10" text-anchor="middle">Stay Logged In</text>

  <!-- Loop back to Admin Dashboard -->
  <line x1="590" y1="1155" x2="960" y2="1155" stroke="#475569" stroke-width="2"/>
  <line x1="960" y1="1155" x2="960" y2="310" stroke="#475569" stroke-width="2"/>
  <line x1="960" y1="310" x2="630" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>
  <text x="890" y="1145" fill="#475569" font-size="12" font-weight="700">Yes</text>

  <!-- End / Logout -->
  <line x1="500" y1="1195" x2="500" y2="1235" stroke="#475569" stroke-width="2" marker-end="url(#arrow-a)"/>
  <text x="510" y="1220" fill="#dc2626" font-size="12" font-weight="700">No</text>

  <rect x="420" y="1235" width="160" height="46" rx="23" fill="#64748b" filter="url(#shadow-a)"/>
  <text x="500" y="1263" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">End: Logout</text>
</svg>

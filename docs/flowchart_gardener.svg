<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1380" width="1000" height="1380" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="shadow-g" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="20" width="940" height="65" rx="12" fill="#065f46"/>
  <text x="500" y="48" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Figure 3.2.2: Gardener Process Flowchart</text>
  <text x="500" y="70" fill="#a7f3d0" font-size="13" text-anchor="middle">Idle Land for Community Gardening System</text>

  <!-- Start -->
  <rect x="410" y="110" width="180" height="46" rx="23" fill="#10b981" filter="url(#shadow-g)"/>
  <text x="500" y="139" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Start: Gardener Access</text>

  <line x1="500" y1="156" x2="500" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <!-- Decision: Has Account? -->
  <polygon points="500,190 590,230 500,270 410,230" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow-g)"/>
  <text x="500" y="226" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">Has Account?</text>
  <text x="500" y="242" fill="#92400e" font-size="11" text-anchor="middle">Already registered</text>

  <!-- No Branch -> Register -->
  <line x1="410" y1="230" x2="250" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>
  <text x="330" y="222" fill="#b45309" font-size="12" font-weight="700">No</text>

  <rect x="110" y="202" width="140" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="180" y="225" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Register Account</text>
  <text x="180" y="243" fill="#64748b" font-size="11" text-anchor="middle">Role = 'gardener'</text>

  <line x1="180" y1="258" x2="180" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="100" y="300" width="160" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="180" y="322" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">Database Storage</text>
  <text x="180" y="338" fill="#3b82f6" font-size="11" text-anchor="middle">Save to users table</text>

  <!-- Connector from Register back to Login -->
  <line x1="260" y1="325" x2="410" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <!-- Yes Branch -> Login -->
  <line x1="500" y1="270" x2="500" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>
  <text x="510" y="288" fill="#059669" font-size="12" font-weight="700">Yes</text>

  <!-- Login Box -->
  <rect x="410" y="300" width="180" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="500" y="323" fill="#1e293b" font-size="13" font-weight="600" text-anchor="middle">Gardener Login</text>
  <text x="500" y="339" fill="#64748b" font-size="11" text-anchor="middle">Verify Credentials</text>

  <line x1="500" y1="350" x2="500" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <!-- Dashboard -->
  <rect x="390" y="380" width="220" height="46" rx="8" fill="#064e3b" stroke="#065f46" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="500" y="408" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Gardener Dashboard</text>

  <!-- 3 Branches Split Line -->
  <line x1="500" y1="426" x2="500" y2="455" stroke="#475569" stroke-width="2"/>
  <line x1="190" y1="455" x2="810" y2="455" stroke="#475569" stroke-width="2"/>
  <line x1="190" y1="455" x2="190" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>
  <line x1="500" y1="455" x2="500" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>
  <line x1="810" y1="455" x2="810" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <!-- Subflow 1: Explore & Request Plots (Left) -->
  <rect x="70" y="480" width="240" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="190" y="505" fill="#15803d" font-size="13" font-weight="700" text-anchor="middle">A. Browse &amp; Request Plots</text>

  <line x1="190" y1="520" x2="190" y2="545" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="80" y="545" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="190" y="567" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Open Map &amp; Land Catalog</text>
  <text x="190" y="583" fill="#64748b" font-size="11" text-anchor="middle">Query lands (status = 'approved')</text>

  <line x1="190" y1="595" x2="190" y2="620" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="80" y="620" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="190" y="642" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Filter &amp; Select Land</text>
  <text x="190" y="658" fill="#64748b" font-size="11" text-anchor="middle">Location, Area, Open Plots</text>

  <line x1="190" y1="670" x2="190" y2="695" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="80" y="695" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="190" y="717" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">View Land Dossier</text>
  <text x="190" y="733" fill="#64748b" font-size="11" text-anchor="middle">Images, Rules &amp; Available Plots</text>

  <line x1="190" y1="745" x2="190" y2="770" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <!-- Decision: Apply? -->
  <polygon points="190,770 280,805 190,840 100,805" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow-g)"/>
  <text x="190" y="802" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">Apply for Plot?</text>
  <text x="190" y="817" fill="#92400e" font-size="10" text-anchor="middle">Interested</text>

  <!-- Return to browse if no -->
  <line x1="100" y1="805" x2="45" y2="805" stroke="#475569" stroke-width="1.5"/>
  <line x1="45" y1="805" x2="45" y2="570" stroke="#475569" stroke-width="1.5"/>
  <line x1="45" y1="570" x2="80" y2="570" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <text x="50" y="795" fill="#475569" font-size="11" font-weight="700">No</text>

  <!-- Yes -> Fill Application -->
  <line x1="190" y1="840" x2="190" y2="870" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green-g)"/>
  <text x="200" y="858" fill="#059669" font-size="11" font-weight="700">Yes</text>

  <rect x="80" y="870" width="220" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="190" y="892" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Complete Application Form</text>
  <text x="190" y="908" fill="#64748b" font-size="11" text-anchor="middle">Select Plot ID, Purpose &amp; Duration</text>

  <line x1="190" y1="925" x2="190" y2="950" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="80" y="950" width="220" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="190" y="971" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">Save to requests table</text>
  <text x="190" y="987" fill="#3b82f6" font-size="11" text-anchor="middle">Status = 'pending'</text>

  <line x1="190" y1="998" x2="190" y2="1025" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <!-- Decision: Landowner outcome -->
  <polygon points="190,1025 285,1065 190,1105 95,1065" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow-g)"/>
  <text x="190" y="1060" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">Request Result?</text>
  <text x="190" y="1076" fill="#92400e" font-size="10" text-anchor="middle">Owner Evaluation</text>

  <!-- Rejected -->
  <line x1="95" y1="1065" x2="45" y2="1065" stroke="#dc2626" stroke-width="2"/>
  <line x1="45" y1="1065" x2="45" y2="1140" stroke="#dc2626" stroke-width="2"/>
  <line x1="45" y1="1140" x2="80" y2="1140" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red-g)"/>
  <text x="50" y="1055" fill="#dc2626" font-size="11" font-weight="700">Rejected</text>

  <rect x="80" y="1120" width="100" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="130" y="1144" fill="#b91c1c" font-size="11" font-weight="600" text-anchor="middle">Declined</text>

  <!-- Approved -->
  <line x1="190" y1="1105" x2="190" y2="1135" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green-g)"/>
  <text x="200" y="1125" fill="#059669" font-size="11" font-weight="700">Approved</text>

  <rect x="185" y="1135" width="125" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="247" y="1159" fill="#065f46" font-size="11" font-weight="600" text-anchor="middle">Plot Assigned</text>


  <!-- Subflow 2: Garden Tasks & Schedules (Middle) -->
  <rect x="380" y="480" width="240" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="505" fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle">B. Participate in Schedules</text>

  <line x1="500" y1="520" x2="500" y2="550" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="390" y="550" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="500" y="572" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">View Activity Calendar</text>
  <text x="500" y="588" fill="#64748b" font-size="11" text-anchor="middle">Fetch tasks from schedules</text>

  <line x1="500" y1="600" x2="500" y2="635" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="390" y="635" width="220" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="500" y="657" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Identify Assigned Tasks</text>
  <text x="500" y="673" fill="#64748b" font-size="11" text-anchor="middle">Planting, Watering, Weeding,</text>
  <text x="500" y="687" fill="#64748b" font-size="10" text-anchor="middle">Soil Conditioning, Harvesting</text>

  <line x1="500" y1="695" x2="500" y2="735" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="390" y="735" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="500" y="757" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Execute Garden Duties</text>
  <text x="500" y="773" fill="#64748b" font-size="11" text-anchor="middle">On-site plot maintenance</text>

  <line x1="500" y1="785" x2="500" y2="825" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="390" y="825" width="220" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="500" y="850" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">Task Completed</text>


  <!-- Subflow 3: Record Harvests (Right) -->
  <rect x="690" y="480" width="240" height="40" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="810" y="505" fill="#b45309" font-size="13" font-weight="700" text-anchor="middle">C. Record Harvest Yield</text>

  <line x1="810" y1="520" x2="810" y2="550" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="700" y="550" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="810" y="572" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Open Harvest Form</text>
  <text x="810" y="588" fill="#64748b" font-size="11" text-anchor="middle">Select Land &amp; Occupied Plot</text>

  <line x1="810" y1="600" x2="810" y2="635" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="700" y="635" width="220" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="810" y="657" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Input Harvest Metrics</text>
  <text x="810" y="673" fill="#64748b" font-size="11" text-anchor="middle">Crop name, Quantity, Unit (kg),</text>
  <text x="810" y="687" fill="#64748b" font-size="10" text-anchor="middle">Harvest date &amp; notes</text>

  <line x1="810" y1="695" x2="810" y2="735" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="700" y="735" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="810" y="757" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Upload Harvest Proof Photo</text>
  <text x="810" y="773" fill="#64748b" font-size="11" text-anchor="middle">Store image in uploads/harvests</text>

  <line x1="810" y1="785" x2="810" y2="825" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="700" y="825" width="220" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-g)"/>
  <text x="810" y="846" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">Save to harvests table</text>
  <text x="810" y="862" fill="#3b82f6" font-size="11" text-anchor="middle">Adds to community yield metrics</text>


  <!-- Bottom Connectors to Return / Finish -->
  <line x1="130" y1="1160" x2="130" y2="1200" stroke="#475569" stroke-width="2"/>
  <line x1="247" y1="1175" x2="247" y2="1200" stroke="#475569" stroke-width="2"/>
  <line x1="500" y1="865" x2="500" y2="1200" stroke="#475569" stroke-width="2"/>
  <line x1="810" y1="873" x2="810" y2="1200" stroke="#475569" stroke-width="2"/>

  <line x1="130" y1="1200" x2="810" y2="1200" stroke="#475569" stroke-width="2"/>
  <line x1="500" y1="1200" x2="500" y2="1225" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>

  <!-- Decision: Continue or Logout -->
  <polygon points="500,1225 590,1260 500,1295 410,1260" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow-g)"/>
  <text x="500" y="1256" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">Continue Session?</text>
  <text x="500" y="1272" fill="#92400e" font-size="10" text-anchor="middle">More actions</text>

  <!-- Loop back to Dashboard -->
  <line x1="590" y1="1260" x2="960" y2="1260" stroke="#475569" stroke-width="2"/>
  <line x1="960" y1="1260" x2="960" y2="403" stroke="#475569" stroke-width="2"/>
  <line x1="960" y1="403" x2="610" y2="403" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>
  <text x="890" y="1252" fill="#475569" font-size="12" font-weight="700">Yes</text>

  <!-- End / Logout -->
  <line x1="500" y1="1295" x2="500" y2="1320" stroke="#475569" stroke-width="2" marker-end="url(#arrow-g)"/>
  <text x="510" y="1312" fill="#dc2626" font-size="12" font-weight="700">No</text>

  <rect x="420" y="1320" width="160" height="42" rx="21" fill="#64748b" filter="url(#shadow-g)"/>
  <text x="500" y="1346" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">End: Logout</text>
</svg>

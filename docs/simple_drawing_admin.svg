<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" width="760" height="980" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="sa-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Outline Border & Header -->
  <rect x="15" y="15" width="730" height="950" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="48" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">Figure 3.2.3a: Administrator Process Flowchart (Simple Line Drawing)</text>
  <line x1="30" y1="65" x2="730" y2="65" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 1. Start -->
  <rect x="300" y="85" width="160" height="42" rx="21" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="111" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">START: ADMIN</text>

  <line x1="380" y1="127" x2="380" y2="160" stroke="#1e293b" stroke-width="2" marker-end="url(#sa-arrow)"/>

  <!-- 2. Secure Login -->
  <rect x="270" y="160" width="220" height="46" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="181" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Admin Secure Login</text>
  <text x="380" y="196" fill="#475569" font-size="10" text-anchor="middle">Verify Role = 'admin'</text>

  <line x1="380" y1="206" x2="380" y2="240" stroke="#1e293b" stroke-width="2" marker-end="url(#sa-arrow)"/>

  <!-- 3. Admin Dashboard -->
  <rect x="250" y="240" width="260" height="46" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="261" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Admin Control Dashboard</text>
  <text x="380" y="276" fill="#475569" font-size="10" text-anchor="middle">View Pending Verifications &amp; Metrics</text>

  <line x1="380" y1="286" x2="380" y2="320" stroke="#1e293b" stroke-width="2" marker-end="url(#sa-arrow)"/>

  <!-- 4. Fetch Pending Lands -->
  <rect x="250" y="320" width="260" height="46" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="340" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Retrieve Pending Land Listings</text>
  <text x="380" y="355" fill="#475569" font-size="10" text-anchor="middle">Query lands WHERE status = 'pending'</text>

  <line x1="380" y1="366" x2="380" y2="400" stroke="#1e293b" stroke-width="2" marker-end="url(#sa-arrow)"/>

  <!-- 5. Audit LRA Documents -->
  <rect x="230" y="400" width="300" height="50" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="420" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Audit LRA &amp; Ownership Documents</text>
  <text x="380" y="435" fill="#475569" font-size="10" text-anchor="middle">Examine Title No, ROD, EPEB No, Scans &amp; Receipts</text>

  <line x1="380" y1="450" x2="380" y2="480" stroke="#1e293b" stroke-width="2" marker-end="url(#sa-arrow)"/>

  <!-- 6. Decision: Valid Title? -->
  <polygon points="380,480 475,515 380,550 285,515" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="511" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Legitimate Title?</text>
  <text x="380" y="525" fill="#475569" font-size="9" text-anchor="middle">LRA verification check</text>

  <!-- Rejected Branch (Left) -->
  <line x1="285" y1="515" x2="185" y2="515" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="185" y1="515" x2="185" y2="575" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sa-arrow)"/>
  <text x="215" y="505" fill="#0f172a" font-size="10" font-weight="600">No (Reject)</text>

  <rect x="90" y="575" width="190" height="46" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="185" y="595" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Set Status = 'rejected'</text>
  <text x="185" y="609" fill="#475569" font-size="9" text-anchor="middle">Provide Rejection Reason to Owner</text>

  <!-- Approved Branch (Right) -->
  <line x1="475" y1="515" x2="575" y2="515" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="575" y1="515" x2="575" y2="575" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sa-arrow)"/>
  <text x="505" y="505" fill="#0f172a" font-size="10" font-weight="600">Yes (Approve)</text>

  <rect x="480" y="575" width="190" height="46" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="575" y="595" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Set Status = 'approved'</text>
  <text x="575" y="609" fill="#475569" font-size="9" text-anchor="middle">is_lra_verified = 1 (Published)</text>

  <!-- Join back to Update DB -->
  <line x1="185" y1="621" x2="185" y2="650" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="575" y1="621" x2="575" y2="650" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="185" y1="650" x2="575" y2="650" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="380" y1="650" x2="380" y2="675" stroke="#1e293b" stroke-width="2" marker-end="url(#sa-arrow)"/>

  <!-- 7. Save to Database -->
  <rect x="250" y="675" width="260" height="42" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="695" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Commit Land Record Update</text>
  <text x="380" y="709" fill="#475569" font-size="10" text-anchor="middle">Persist to lands database table</text>

  <line x1="380" y1="717" x2="380" y2="745" stroke="#1e293b" stroke-width="2" marker-end="url(#sa-arrow)"/>

  <!-- 8. Manage Users -->
  <rect x="240" y="745" width="280" height="46" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="765" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Manage Platform Users</text>
  <text x="380" y="780" fill="#475569" font-size="10" text-anchor="middle">Inspect accounts; toggle active / inactive status</text>

  <line x1="380" y1="791" x2="380" y2="820" stroke="#1e293b" stroke-width="2" marker-end="url(#sa-arrow)"/>

  <!-- 9. Reports & Analytics -->
  <rect x="230" y="820" width="300" height="48" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="840" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Generate System Analytics &amp; Reports</text>
  <text x="380" y="855" fill="#475569" font-size="10" text-anchor="middle">Land utilization rates, total harvest yields, export PDF</text>

  <line x1="380" y1="868" x2="380" y2="905" stroke="#1e293b" stroke-width="2" marker-end="url(#sa-arrow)"/>

  <!-- 10. End -->
  <rect x="300" y="905" width="160" height="42" rx="21" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="931" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">END: LOGOUT</text>
</svg>
